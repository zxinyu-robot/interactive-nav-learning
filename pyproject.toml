[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interrupt-nav"
version = "0.1.0"
description = "Interruptible learning-based navigation research baseline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
train = ["torch>=2.1"]
dev = ["pytest>=8", "ruff>=0.6", "torch>=2.1"]

[project.scripts]
interrupt-nav = "interrupt_nav.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interrupt_nav"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
